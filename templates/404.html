{% extends "base.html" %}
{% load static %}

{% block title %}Page Not Found - Diffly{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-6 py-12">
    <div class="max-w-3xl w-full">
        <!-- Main Error Card -->
        <div class="p-8 md:p-12 text-center">
            <!-- 404 Icon -->
            <div class="mb-2">
                <svg class="w-24 h-24 mx-auto text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>

            <!-- Error Code -->
            <div class="text-8xl font-bold text-accent mb-2" aria-hidden="true">404</div>

            <!-- Error Message -->
            <h1 class="text-2xl font-bold">Page Not Found</h1>
            <p class="text-gray-400 mb-8 max-w-md mx-auto">
                The page you're looking for doesn't exist or has been moved.
            </p>

            <!-- Action Buttons -->
                <a href="{% url 'index' %}"
                   class="bg-accent text-dark-bg px-12 py-3 rounded-lg font-semibold hover:scale-105 transition-transform inline-flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Back to Home
                </a>
        </div>
    </div>
</section>
{% endblock %}
